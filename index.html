<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<style>
:root{--bg1:#e8e4f4;--bg2:#cfe3f1;--fg:#16181d;--mut:#5a606b;--card:#fff;--bar:#ecebf2;--line:#d3d0dc;--acc:#d6322a;--btn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1140;--bg2:#05070f;--fg:#eef1f6;--mut:#9aa3b2;--card:#10131b;--bar:#1b2030;--line:#2a3144;--acc:#ff4a3d;--btn:#262d42}}
:root[data-theme="dark"]{--bg1:#1a1140;--bg2:#05070f;--fg:#eef1f6;--mut:#9aa3b2;--card:#10131b;--bar:#1b2030;--line:#2a3144;--acc:#ff4a3d;--btn:#262d42}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:
radial-gradient(1.5px 1.5px at 12% 20%,#fff8,transparent),radial-gradient(1px 1px at 70% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 30% 80%,#fff8,transparent),radial-gradient(1px 1px at 55% 45%,#fff6,transparent),
radial-gradient(ellipse at 30% 20%,var(--bg1),var(--bg2) 75%);background-attachment:fixed}
#win{position:fixed;inset:calc(env(safe-area-inset-top,0px) + max(14px,3vh)) calc(env(safe-area-inset-right,0px) + max(14px,3vw)) calc(env(safe-area-inset-bottom,0px) + max(14px,3vh)) calc(env(safe-area-inset-left,0px) + max(14px,3vw));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
#win:fullscreen,#win.max{inset:0;border-radius:0;border:0;width:100%;height:100%}
#win.max{position:fixed;z-index:10;padding-top:env(safe-area-inset-top,0px)}
@media (max-width:600px){#win{inset:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px) 8px;border-radius:12px}}
.bar{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.dots{display:flex;gap:6px;margin:0 4px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.bar button,.bar a{width:36px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--fg);font-size:17px;line-height:1;cursor:pointer;text-decoration:none}
.bar button:hover,.bar a:hover{border-color:var(--acc)}
#ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;padding-left:4px}
[hidden]{display:none!important}
#hv{flex:1;overflow:auto;padding:22px 20px 30px}
#hv h1{margin:0 0 2px;font-size:26px}.sub{margin:0 0 20px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;max-width:1000px}
.tile{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid var(--line);padding:0;font:inherit;color:#fff;text-align:left;background:var(--bar)}
button.tile{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
button.tile:hover,button.tile:focus-visible{transform:translateY(-3px) scale(1.03);border-color:var(--acc);box-shadow:0 8px 22px rgba(0,0,0,.4);outline:none}
.tile .art{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.tile .lab{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-weight:700;font-size:14px;line-height:1.2;text-shadow:0 1px 2px #000}
.tile.empty{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);background:transparent;color:var(--line);font-size:28px}
#gv{flex:1;background:#000;min-height:0}
#fr{display:block;width:100%;height:100%;border:0}
</style></head><body>
<div id="win" role="application" aria-label="Game window">
 <header class="bar">
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  <button id="home" title="Home" aria-label="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <span id="ttl">Games</span>
  <a id="ext" href="#" target="_blank" rel="noopener" hidden title="Open in a new tab" aria-label="Open in a new tab">↗</a>
  <button id="fs" title="Full screen" aria-label="Full screen">⤢</button>
 </header>
 <section id="hv">
  <h1>Games</h1><p class="sub">Tap a tile to play. It opens in this window.</p>
  <div class="grid" id="grid">
   <button class="tile" data-g="starlane" aria-label="Starlane"><svg class="art" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05061a"/><stop offset="1" stop-color="#1a1050"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#7fe7ff" stop-opacity=".9"/><stop offset="1" stop-color="#7fe7ff" stop-opacity="0"/></radialGradient></defs>
    <rect width="320" height="180" fill="url(#sg)"/>
    <g fill="#fff"><circle cx="20" cy="22" r="1"/><circle cx="64" cy="60" r="1.4"/><circle cx="110" cy="18" r="1"/><circle cx="170" cy="48" r="1.2"/><circle cx="230" cy="20" r="1"/><circle cx="290" cy="58" r="1.4"/><circle cx="300" cy="140" r="1"/><circle cx="36" cy="130" r="1.2"/><circle cx="130" cy="150" r="1"/><circle cx="250" cy="110" r="1"/></g>
    <g stroke="#7fe7ff" stroke-opacity=".25"><path d="M160 180L80 0M160 180L240 0M160 180L160 0"/></g>
    <g fill="#4b4660" stroke="#8a84a8" stroke-width="1.5"><polygon points="62,40 84,34 98,52 88,72 66,70 54,56"/><polygon points="226,70 250,64 266,84 252,104 230,100 218,86"/><polygon points="150,22 164,18 172,30 164,42 150,40"/></g>
    <circle cx="160" cy="146" r="26" fill="url(#gl)"/><polygon points="160,122 148,156 160,148 172,156" fill="#e8f7ff" stroke="#7fe7ff" stroke-width="1.5"/>
    </svg><span class="lab">Starlane ↗</span></button>
   <button class="tile" data-g="cctv" aria-label="Spot The Demon CCTV"><svg class="art" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><radialGradient id="vg" cx=".5" cy=".5" r=".7"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".35"/></pattern></defs>
    <rect width="320" height="180" fill="#0c1a12"/>
    <path d="M0 180L110 110L110 20L0 0Z" fill="#12281b"/><path d="M110 110L320 110L320 180L0 180Z" fill="#1a3324"/><path d="M110 20L320 20L320 110L110 110Z" fill="#0f2217"/>
    <g stroke="#39ff7a" stroke-opacity=".35" fill="none"><path d="M0 0L110 20L320 20M0 180L110 110L320 110M110 20L110 110"/><rect x="190" y="48" width="64" height="62" fill="#0a150e"/></g>
    <rect x="136" y="80" width="40" height="30" fill="#2a1a1e"/><ellipse cx="222" cy="70" rx="12" ry="20" fill="#2b0508"/>
    <circle cx="217" cy="64" r="3.4" fill="#ffdd33"/><circle cx="227" cy="64" r="3.4" fill="#ffdd33"/><circle cx="217" cy="64" r="9" fill="#ff3010" opacity=".25"/><circle cx="227" cy="64" r="9" fill="#ff3010" opacity=".25"/>
    <path d="M214 53L208 40M230 53L236 40" stroke="#3a261c" stroke-width="3" stroke-linecap="round"/>
    <rect width="320" height="180" fill="url(#sl)"/><rect width="320" height="180" fill="url(#vg)"/>
    <circle cx="20" cy="20" r="4" fill="#ff3b30"/><text x="30" y="24" fill="#d8f5de" font-family="monospace" font-size="11">REC CAM 02</text><text x="238" y="170" fill="#d8f5de" font-family="monospace" font-size="11">03:12:44</text>
    </svg><span class="lab">Spot The Demon CCTV ↗</span></button>
  </div>
 </section>
 <section id="gv" hidden><iframe id="fr" allow="fullscreen; autoplay; gamepad; accelerometer" title="Game"></iframe></section>
</div>
<script>
const $=id=>document.getElementById(id),win=$('win'),fr=$('fr');
const G={starlane:{name:'Starlane',tab:'https://lanktyn.github.io/RSG/',src:'https://lanktyn.github.io/RSG/',ext:'https://lanktyn.github.io/RSG/'},cctv:{name:'Spot The Demon CCTV',tab:'https://lanktyn.github.io/Spot-The-Demon-CCTV/'}};
function openGame(id){const g=G[id];fr.removeAttribute('srcdoc');fr.removeAttribute('src');
  if(g.doc)fr.srcdoc=$(g.doc).textContent.replace(/<\\\/script/g,'</script');else fr.src=g.src;
  $('hv').hidden=true;$('gv').hidden=false;$('ttl').textContent=g.name;
  const e=$('ext');if(g.ext){e.href=g.ext;e.hidden=false}else e.hidden=true}
function goHome(){fr.removeAttribute('srcdoc');fr.src='about:blank';$('gv').hidden=true;$('hv').hidden=false;fillGrid();$('ttl').textContent='Games';$('ext').hidden=true}
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=G[b.dataset.g];if(g.tab)window.open(g.tab,'_blank','noopener');else openGame(b.dataset.g)});
$('home').onclick=goHome;
function fillGrid(){const g=$('grid');g.querySelectorAll('.empty').forEach(e=>e.remove());
  const cols=getComputedStyle(g).gridTemplateColumns.split(' ').length,n=g.children.length,total=Math.max(cols*3,Math.ceil(n/cols)*cols);
  for(let i=n;i<total;i++){const d=document.createElement('div');d.className='tile empty';d.textContent='+';g.appendChild(d)}}
fillGrid();addEventListener('resize',fillGrid);
const isFs=()=>document.fullscreenElement===win||document.webkitFullscreenElement===win||win.classList.contains('max');
function upd(){$('fs').textContent=isFs()?'⤡':'⤢';$('fs').title=isFs()?'Exit full screen':'Full screen'}
$('fs').onclick=async()=>{
  if(isFs()){win.classList.remove('max');const x=document.exitFullscreen||document.webkitExitFullscreen;if(document.fullscreenElement||document.webkitFullscreenElement)try{await x.call(document)}catch(e){}}
  else{const r=win.requestFullscreen||win.webkitRequestFullscreen;try{if(!r)throw 0;await r.call(win)}catch(e){win.classList.add('max')}}
  upd()};
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,upd));
addEventListener('keydown',e=>{if(e.key=='Escape'&&win.classList.contains('max')){win.classList.remove('max');upd()}});
</script></body></html>
